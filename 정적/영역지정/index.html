<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옛한글 OCR</title>
<style>
:root {
  --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --line: #d6d5cf; --panel: #ffffff;
  --accent: #2f5fb3; --low: #c2362b; --ok: #2f7d4a; --sel: #e0a100;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1b1a; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3a37; --panel: #252523;
          --accent: #7aa2ec; --low: #f0776c; --ok: #6cc28c; --sel: #f2c14e; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
       font: 14px/1.5 "Noto Sans KR", "Malgun Gothic", sans-serif; }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative;
         display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
input[type=text], input[type=number], select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
       background: var(--bg); color: var(--fg); font: inherit; }
#src { width: min(420px, 100%); }
#pageNo { width: 70px; }
button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
         color: var(--fg); font: inherit; cursor: pointer; }
button.main { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
#msg { color: var(--muted); flex: 1 1 200px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#msg.err { color: var(--low); }
/* 인식 로그 — 머리줄 오른쪽 끝의 작은 링크, 누르면 그 아래에 펼침(소도구의 '인식 로그' 와 같은 꼴) */
#logBtn { font-size: 11px; color: var(--muted); text-decoration: none; white-space: nowrap; margin-left: auto; }
#logBox { position: absolute; right: 16px; top: 100%; z-index: 20; width: min(560px, calc(100vw - 32px));
          background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px;
          box-shadow: 0 4px 16px rgba(0, 0, 0, .18); font-size: 12px; color: var(--muted); }
#logBox textarea { font: 12px/1.45 monospace; white-space: pre-wrap; word-break: break-all; height: 18em;
                   min-height: 0; resize: vertical; }
#logBox div { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
#logBox button { font-size: 12px; padding: 2px 8px; }
header, #tools { flex: none; }
/* 왼쪽(스캔 보기 창) 폭은 불러온 쪽의 비율에 맞춰 `폭맞추기` 가 정함 — 남는 폭은 오른쪽으로 */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(360px, 1fr); gap: 0; }
@media (max-width: 900px) { body { height: auto; } main { display: block; }
  #left { width: auto !important; height: 75vh; border-right: 0; border-bottom: 1px solid var(--line); } }
#left { width: 55vw; overflow: auto; position: relative; padding: 12px; border-right: 1px solid var(--line);
        scrollbar-width: thin; }
#tools { background: var(--panel); border-bottom: 1px solid var(--line);
         padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
#tools label { white-space: nowrap; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#stage { position: relative; margin: 0 auto; touch-action: none; }
#stage canvas { position: absolute; left: 0; top: 0; width: 100%; }
#scan { position: relative !important; display: block; }
#over { cursor: grab; }
#left.boxing #over { cursor: crosshair; }
#left.panning, #left.panning #over { cursor: grabbing; }
#empty { padding: 40px 16px; color: var(--muted); }
#right { overflow: auto; padding: 12px; background: var(--panel); }
#right h2 { font-size: 14px; margin: 8px 0; }
#pieces { list-style: none; margin: 0; padding: 0; }
#pieces li { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; cursor: pointer; }
#pieces li.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
#pieces .meta { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#pieces .meta button { padding: 0 6px; font-size: 12px; }
#pieces .txt { font-size: 16px; word-break: break-all; }
.low { color: var(--low); background: color-mix(in srgb, var(--low) 12%, transparent); }
textarea { width: 100%; min-height: 160px; font: 16px/1.6 "Noto Sans KR", "Malgun Gothic", sans-serif;
           border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); padding: 6px; }
.hint { color: var(--muted); font-size: 12px; }
kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>옛한글 OCR</h1>
  <input id="src" type="text" placeholder="파일 이름 또는 위키문헌 페이지 주소 (예: 책이름.pdf/12)">
  <label>쪽 <input id="pageNo" type="number" min="1"></label>
  <button id="loadBtn" class="main">불러오기</button>
  <span id="msg"></span>
  <a id="logBtn" href="#" role="button" title="마지막으로 한 일(불러오기 · 상자 읽기 …)의 기록 — 잘 안 읽힌 자리를 알릴 때 복사해 붙여 주세요">인식 로그</a>
  <div id="logBox" hidden>
    <textarea id="logText" readonly spellcheck="false"></textarea>
    <div><button id="logCopy">복사</button><span id="logNote"></span></div>
  </div>
</header>
<div id="tools">
  <span class="seg"><button id="panBtn" class="on" title="끌어서 스캔을 옮깁니다. 짧게 누르면 그 자리 조각을 고릅니다.">이동</button><button id="boxBtn" title="끌어서 읽을 자리에 상자를 칩니다. 옆의 '인식 방법'을 골라도 켜집니다.">선택</button></span>
  <label id="modelBox" hidden title="읽는 모델 — 서버가 가진 모델 중에서 고릅니다. 바꾸면 이어서 읽는 상자부터 새 모델로 읽습니다.">모델 <select id="modelSel"></select></label>
  <label title="상자를 무엇으로 읽을지 — 고르면 '선택'이 켜집니다">인식 방법 <select id="modeSel">
    <option value="열" selected>열(줄) 하나</option>
    <option value="글자">글자 하나</option>
    <option value="영역">여러 열</option>
  </select></label>
  <label title="비우면 모델이 칸수를 고릅니다">글자 수 <input id="nIn" type="number" min="1" style="width:56px" placeholder="자동"></label>
  <label title="세로 글자 간격 ÷ 열 간격 — 불러올 때 쪽에서 잼">자간비 <input id="ratioIn" type="number" step="0.001" style="width:72px"></label>
  <button id="autoBtn" disabled>쪽 전체 자동 읽기</button>
  <button id="zoomOut" title="축소 (스캔 위에서 휠을 아래로)">－</button><button id="zoomFit" title="쪽 전체가 보이게">맞춤</button><button id="zoomIn" title="확대 (스캔 위에서 휠을 위로)">＋</button>
  <label><input id="showText" type="checkbox" checked> 글자 보기</label>
  <label title="끄면 새로 상자를 칠 때 앞에 읽은 조각을 모두 지우고 새로 읽습니다. 켜면 앞 조각을 남겨 두고 그 위에 고쳐 넣습니다(쪽 전체 자동 읽기 결과를 고칠 때).">
    <input id="keepIn" type="checkbox"> 앞 조각 남기기</label>
</div>
<main id="main">
  <section id="left">
    <div id="empty">위에 파일 이름(또는 위키문헌 '페이지:' 주소)과 쪽 번호를 넣고 불러오세요.<br>
      스캔 위에서 끌면 화면이 옮겨지고, 마우스 휠로 확대 · 축소합니다.<br>
      <b>선택</b>을 누르면(또는 '인식 방법'을 고르면) 끌어서 상자를 쳐 그 자리를 읽습니다.</div>
    <div id="stage" hidden>
      <canvas id="scan"></canvas>
      <canvas id="over"></canvas>
    </div>
  </section>
  <section id="right">
    <h2>읽은 조각 <span class="hint">(오른쪽 열부터)</span></h2>
    <ul id="pieces"></ul>
    <h2>결과 <label class="hint" title="켜면 모델이 확신하지 못한 글자를 ⟪ ⟫ 로 감싸 결과에 남깁니다"><input id="markIn" type="checkbox"> 확신 낮은 글자를 ⟪⟫ 로 표시</label></h2>
    <textarea id="out" spellcheck="false"></textarea>
    <p><button id="copyBtn">복사</button> <button id="clearBtn">모두 지우기</button></p>
  </section>
</main>

<script src="서버.js"></script><!-- Toolforge 에서만 있음(서버 주소를 채움) — 없으면 404 한 번(정상) -->
<script src="읽기.js"></script>
<script src="영역읽기.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ORT_CDN = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const st = {
  host: "ko.wikisource.org", file: "", page: null,
  g: null, 열간격: null, 자간비: null,
  조각: [], 다음id: 1, 고름: null, zoom: 1,
};
let 모델 = null, 설정 = null, 준비중 = null;
let 쪽세대 = 0;                 // 같은 쪽을 다시 불러와도 이전 작업은 무효

function 알림(t, err) { $("msg").textContent = t; $("msg").title = t; $("msg").className = err ? "err" : ""; }

// ── 인식 로그 — 잘 안 읽힌 자리를 알릴 때 복사해 붙일 글(마지막 한 번만) ──
// ⚠ 머리 · 꼴은 `소도구.js` 의 `로그머리` · `로그쓰기` 와 같게. 여기서만: 불러올 때 잰 값(`st.불러온`)을 매번 함께 적음
let 로그글 = "", 모델목록 = {};
const 방식이름 = { 열: "열(줄) 하나", 글자: "글자 하나", 영역: "여러 열" };

function 시각글(d) {
  const p = n => String(n).padStart(2, "0"), 차 = -d.getTimezoneOffset();
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " "
       + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds())
       + " (UTC" + (차 >= 0 ? "+" : "-") + p(Math.floor(Math.abs(차) / 60)) + ":" + p(Math.abs(차) % 60) + ")";
}
function 초글(ms) { return (ms / 1000).toFixed(1) + "초"; }
function 시간글(때, 처음) {
  return Object.keys(때).map(k => k + " " + 초글(때[k])).concat("전체 " + 초글(performance.now() - 처음)).join(" · ");
}
function 판형글(값) { return Array.isArray(값) ? (값.length + 1) + "단(가로줄로 가름)" : 값 + "단"; }

/** 문서 · 주소 · 실행 환경 — 늘 적는 것 */
function 로그머리(동작, 언제) {
  const 제목 = st.page ? "페이지:" + st.file + "/" + st.page : "파일:" + st.file;
  const 위키제목 = (st.page ? "Page:" + st.file + "/" + st.page : "File:" + st.file).replace(/ /g, "_");
  return [
    ["도구", "영역 지정 — " + 동작],
    ["모델", 서버 ? 모델이름 + (모델목록[모델이름] ? " (" + 모델목록[모델이름] + ")" : "") : "옛한글모델.onnx(브라우저)"],
    ["시각", 시각글(언제)],
    ["문서", st.file ? 제목 : "(없음)"],
    ["주소", st.file ? "https://" + st.host + "/wiki/" + encodeURIComponent(위키제목).replace(/%2F/g, "/").replace(/%3A/g, ":") : ""],
    ["실행", 서버 ? "서버 " + 서버 : "브라우저(ONNX Runtime)"],
    ["화면", "배율 " + st.zoom.toFixed(2) + " · 앞 조각 남기기 " + ($("keepIn").checked ? "켜짐" : "꺼짐")
            + " · 확신 표시 문턱 " + (설정 ? 설정.표시문턱 : "?")],
    ["브라우저", typeof navigator !== "undefined" ? navigator.userAgent : ""],
  ];
}

function 로그쓰기(줄들) {
  로그글 = "[옛한글 OCR 디버그 로그]\n" + 줄들
    .filter(v => v[1] !== undefined && v[1] !== null && v[1] !== "")
    .map(v => v[0] + ": " + v[1]).join("\n");
  if (!$("logBox").hidden) $("logText").value = 로그글;
}

/** 한 번 한 일의 기록을 남김 — 그사이 쪽이 바뀌었으면 새 쪽 기록을 덮지 않게 버림 */
function 로그남기기(세대, 동작, 언제, 줄, 때, 처음) {
  if (세대 !== 쪽세대) return;
  try {
    로그쓰기(로그머리(동작, 언제).concat(st.불러온 || [], 줄, 때 ? [["걸린 시간", 시간글(때, 처음)]] : []));
  } catch (e) { console.error(e); }
}

function 오류줄(e) {
  const 줄 = [["오류", (e && e.message) || String(e)]];
  if (e && e.stack) 줄.push(["오류 자리", "\n  " + String(e.stack).split("\n").slice(0, 6).join("\n  ")]);
  return 줄;
}

/** 읽은 글자 수 · 확신 낮은 비율 · 줄마다 글자 수 */
function 읽은줄(줄들) {
  const 문턱 = 설정 ? 설정.표시문턱 : 0.9;
  let n = 0, 낮 = 0;
  줄들.forEach(z => { n += z.글자.length; 낮 += Array.from(z.확신).filter(c => c < 문턱).length; });
  const 줄 = [["읽은 것", n + "자 · 확신 낮은 글자 " + 낮 + "자(" + (n ? 낮 / n * 100 : 0).toFixed(1) + "%)"
                         + (줄들.length > 1 ? " · 줄 " + 줄들.length : "")]];
  if (줄들.length > 1) 줄.push(["줄마다 글자 수", 줄들.map(z => z.글자.length).join(" ")]);
  return 줄;
}

/** 열 읽기의 칸수 후보(토막마다 점수 높은 셋) */
function 후보글(후보) {
  if (!Array.isArray(후보) || !후보.length) return "";
  return 후보.map((h, i) => (후보.length > 1 ? "토막 " + (i + 1) + ": " : "") + (Array.isArray(h) ? h : [])
    .slice().sort((a, b) => b.점수 - a.점수).slice(0, 3).map(c => c.칸수 + "칸 " + (+c.점수).toFixed(3)).join(" · ")).join(" / ");
}

function 상자글(b) { return "[" + b.map(Math.round).join(", ") + "] (스캔 px)"; }

$("logBtn").addEventListener("click", e => {
  e.preventDefault();
  const 열림 = $("logBox").hidden;
  $("logBox").hidden = !열림;
  $("logBtn").textContent = 열림 ? "인식 로그 닫기" : "인식 로그";
  $("logText").value = 로그글 || "아직 기록이 없습니다 — 쪽을 불러오거나 상자를 한 번 읽은 뒤에 보세요.";
  $("logNote").textContent = "";
});
$("logCopy").addEventListener("click", () => {
  const 됨 = () => { $("logNote").textContent = "복사했습니다."; };
  const 손으로 = () => {
    $("logText").focus(); $("logText").select();
    try { document.execCommand("copy"); 됨(); } catch (e) { $("logNote").textContent = "Ctrl+C 로 복사해 주세요(골라 두었습니다)."; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText($("logText").value).then(됨, 손으로);
  else 손으로();
});

function 스크립트(url) {
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = url; s.onload = ok; s.onerror = () => no(new Error(url));
    document.head.appendChild(s);
  });
}

// ── 모델 ─────────────────────────────────────────────────────────────
// 서버 모드(`서버.js` 가 window.옛한글OCR서버 를 채움)면 모델 셈만 서버에, 열 찾기 · 칸 나누기는 `읽기.js`
// 아니면 ORT 를 이 폴더의 ort/ 에서, 없으면 jsDelivr 에서
const 서버 = window.옛한글OCR서버 || null;
// 읽는 모델(서버 모드만) — `?model=` > 지난번에 고른 것 > 근대 순한글. 목록은 `/api/health`
const 저장 = (k, v) => { try { if (v === undefined) return localStorage.getItem("옛한글OCR:" + k); localStorage.setItem("옛한글OCR:" + k, v); } catch (e) {} return null; };
let 모델이름 = (서버 && (new URLSearchParams(location.search).get("model") || 저장("모델"))) || "hangul";

if (서버) {
  fetch(서버 + "api/health").then(r => r.json()).then(h => {
    const 목록 = 모델목록 = h.모델들 || { hangul: "근대 순한글" };
    if (!(모델이름 in 목록)) 모델이름 = "hangul";
    const 칸 = $("modelSel");
    for (const k in 목록)칸.add(new Option(목록[k], k));
    칸.value = 모델이름;
    $("modelBox").hidden = false;
    칸.addEventListener("change", () => {
      모델이름 = 칸.value;
      저장("모델", 모델이름);
      준비세대++; 모델 = null; 준비중 = null;           // 다음에 읽을 때 새 모델로 · 앞 모델의 늦은 글자표는 버림
      const q = new URLSearchParams(location.search);
      if (모델이름 === "hangul") q.delete("model"); else q.set("model", 모델이름);
      history.replaceState(null, "", "?" + q);
      알림("모델을 「" + 목록[모델이름] + "」(으)로 바꿨습니다 — 이제 읽는 상자부터 적용됩니다.");
    });
  }).catch(() => {});
}

async function 서버로(경로, 몸) {
  const res = await fetch(서버 + 경로, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(몸) });
  const 답 = await res.json();
  if (!res.ok || 답.오류) throw new Error(답.오류 || ("서버 오류 " + res.status));
  return 답;
}

  for (const p of st.조각) {
    const 안 = [];
    p.상자.forEach((s, i) => {
      const cx = (s[0] + s[2]) / 2, cy = (s[1] + s[3]) / 2;
      if (cx >= b[0] && cx < b[2] && cy >= b[1] && cy < b[3]) 안.push(i);
    });
    if (안.length) {
      const i = 안[0], k = 안.length;
      p.글자.splice(i, k, r.글자[0]); p.확신.splice(i, k, r.확신[0]); p.상자.splice(i, k, b);
      p.범위 = 범위(p.상자); st.고름 = p.id;
      return;
    }
  }
  const 열 = st.조각.find(p => mx >= p.범위[0] && mx < p.범위[2] && my >= p.범위[1] - 200 && my < p.범위[3] + 200);
  if (열) {
    let i = 0;
    while (i < 열.상자.length && (열.상자[i][1] + 열.상자[i][3]) / 2 < my) i++;
    열.글자.splice(i, 0, r.글자[0]); 열.확신.splice(i, 0, r.확신[0]); 열.상자.splice(i, 0, b);
    열.범위 = 범위(열.상자); st.고름 = 열.id;
    return;
  }
  조각더하기("글자", r, b);
}

// ── 쪽 전체 자동 읽기 ─────────────────────────────────────────────────
$("autoBtn").onclick = async () => {
  if (바쁨 || !st.g) return;
  const 세대 = 쪽세대;
  바쁨 = true;
  const 언제 = new Date(), 처음 = performance.now(), 때 = {}, 줄 = [];
  let 앞 = st.조각.length;
  try {
    const 모 = await 준비();
    if (세대 !== 쪽세대) return;
    때["모델 준비"] = performance.now() - 처음;
    줄.push(["옵션", "자간비 " + 옵션().자간비.toFixed(3)]);
    알림("쪽 전체를 읽는 중…");
    const t0 = performance.now();
    let 열들;
    if (서버) {
      const 답 = await 서버로("api/area-read", {
        file: st.file, page: st.page || 1, model: 모.이름,
        ratio: 옵션().자간비, width: st.g.너비, height: st.g.높이,
      });
      if (세대 !== 쪽세대) return;
      때["인식(서버 왕복)"] = performance.now() - t0;
      if (답.초 !== undefined) 때["└ 서버 셈"] = 답.초 * 1000;
      if (답.단계초) 줄.push(["서버 단계", Object.keys(답.단계초).map(k => k + " " + (+답.단계초[k]).toFixed(2) + "초").join(" · ")
                                       + (답.결과재사용 ? " · 저장해 둔 결과 재사용" : "")]);
      if (답.너비 !== st.g.너비 || 답.높이 !== st.g.높이) throw new Error("서버와 화면의 스캔 크기가 다릅니다 — 쪽을 다시 불러오세요");
      열들 = 답.줄들;
    } else {
      열들 = await 영역읽기.쪽전체(모, st.g, 옵션().자간비);
      때["인식"] = performance.now() - t0;
    }
    if (세대 !== 쪽세대) return;
    줄.push(...읽은줄(열들));
    앞 = st.조각.length;
    st.조각 = st.조각.filter(p => p.방식 !== "자동");
    열들.forEach(z => 조각더하기("자동", z, null));
    st.고름 = null;
    $("keepIn").checked = true;    // 새 상자가 자동 결과를 지우지 않게
    그리기목록(); 다시그리기();
    알림("자동으로 " + 열들.length + "열 읽었습니다 (" + ((performance.now() - t0) / 1000).toFixed(1) + "초)");
  } catch (e) { if (세대 === 쪽세대) { 알림("못 읽었습니다: " + (e.message || e), true); console.error(e); 줄.push(...오류줄(e)); } }
  finally {
    if (세대 === 쪽세대) {
      바쁨 = false;
      줄.push(["조각", 앞 + " → " + st.조각.length]);
      로그남기기(세대, "쪽 전체 자동 읽기", 언제, 줄, 때, 처음);
    }
  }
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const p = st.조각.find(q => q.id === st.고름);
  if (!p) return;
  if (e.key === "Delete" || e.key === "Backspace") { 지우기(p.id); e.preventDefault(); }
  else if (p.방식 === "열" && p.원상자 && (e.key === "+" || e.key === "=")) 칸바꾸기(p, +1);
  else if (p.방식 === "열" && p.원상자 && e.key === "-") 칸바꾸기(p, -1);
});

$("loadBtn").onclick = 불러오기;
$("src").addEventListener("keydown", e => { if (e.key === "Enter") 불러오기(); });
$("pageNo").addEventListener("keydown", e => { if (e.key === "Enter") 불러오기(); });

// 주소에 ?file=…&page=… 가 있으면 바로 불러옴(소도구에서 새 창으로 열 때)
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("file")) {
    // 쪽 번호가 있으면 출발한 '페이지:파일/쪽' 주소 모양으로 보여 줌(`해석` 이 그대로 읽음)
    const 쪽있음 = q.get("page") && /\.(pdf|djvu|tiff?)$/i.test(q.get("file"));
    const 이름 = 쪽있음 ? "페이지:" + q.get("file") + "/" + q.get("page") : q.get("file");
    $("src").value = q.get("host") && q.get("host") !== "ko.wikisource.org"
      ? "https://" + q.get("host") + "/wiki/" + (쪽있음 ? "Page:" + q.get("file") + "/" + q.get("page") : "File:" + q.get("file"))
      : 이름;
    if (q.get("page")) $("pageNo").value = q.get("page");
    불러오기();
  }
})();
</script>
